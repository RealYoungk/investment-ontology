    /* Flutter semantic inputs otherwise inherit the browser's small default
       font and trigger iOS focus zoom, even though Flutter paints larger text.
       Keep pinch zoom available; do not cap the viewport scale.
       Upstream: https://github.com/flutter/flutter/issues/192327 */
    flt-semantics input, flt-semantics textarea {
      font-size: 16px;
    }
    /* Keep the initial frame aligned with Research Desk, without font downloads. */
    html, body { margin: 0; height: 100%; background: #FFFFFF; }
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: grid; place-items: center; padding: 24px;
      background: #FFFFFF; color: #202831;
      font-family: "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      transition: opacity .25s ease;
    }
    #splash.gone { opacity: 0; pointer-events: none; }
    .splash-content { position: relative; text-align: center; width: min(100%, 280px); }
    #splash .mark {
      display: block; width: 184px; height: 184px;
      margin: 0 auto 12px; object-fit: contain;
    }
    #splash h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -.7px; line-height: 1.4; }
    #splash .bar { margin: 28px auto 14px; width: 120px; height: 2px; background: #E1E6EC; overflow: hidden; border-radius: 2px; }
    #splash .bar::after {
      content: ""; display: block; height: 100%; width: 45%; background: #276A9B;
      animation: slide 1.5s ease-in-out infinite;
    }
    #splash .hint { margin: 0; font-size: 13px; color: #607080; line-height: 1.6; }
    #splash .slow { position: absolute; top: 100%; left: 0; right: 0; padding-top: 28px; }
    #splash .slow[hidden] { display: none; }
    #splash button {
      margin-top: 12px; min-height: 44px; padding: 0 18px;
      border: 1px solid #BAC5D0; border-radius: 10px; background: #FFFFFF;
      color: #202831; font: inherit; font-size: 13px; cursor: pointer;
    }
    #splash button:focus-visible { outline: 2px solid #276A9B; outline-offset: 3px; }
    @keyframes slide { from { transform: translateX(-110%); } to { transform: translateX(325%); } }
    @media (prefers-reduced-motion: reduce) {
      #splash { transition: none; }
      #splash .bar::after { animation: none; width: 100%; }
    }
  </style>

        <button type="button" id="splash-retry">다시 불러오기</button>

      </div>

  <script>
    (function () {
      var splash = document.getElementById('splash');
      var done = false;
      var slowTimer = setTimeout(function () {
        splash.querySelector('.slow').hidden = false;
      }, 15000);
      document.getElementById('splash-retry').addEventListener('click', function () {
        window.location.reload();
      });
      window.addEventListener('flutter-first-frame', function () {
        if (done) return;
        done = true;
        clearTimeout(slowTimer);
        splash.classList.add('gone');
        setTimeout(function () { splash.remove(); }, 300);
      }, { once: true });
    })();
  </script>
