name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VERSION: '4.0.0'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # 검증한 SDK를 고정해 로컬과 CI를 동일하게 유지한다.
          channel: stable
          flutter-version: 3.47.5

      - name: Install dependencies
        run: flutter pub get

      - name: Install Serverpod CLI
        # `dart install`은 PATH에 없는 폴더에 설치하므로 설치 경로를 PATH에 추가한다.
        run: |
          dart install serverpod_cli $VERSION | tee install.log
          dirname "$(sed -n 's/^Installed: //p' install.log)" >> "$GITHUB_PATH"

      - name: Run Serverpod generator
        working-directory: investment_ontology_serverpod_server
        run: serverpod generate

      - name: Run server tests
        # config/test.yaml의 dataPath가 내장 PostgreSQL을 쓰므로 Docker가 필요 없다.
        working-directory: investment_ontology_serverpod_server
        run: dart test

      - name: Run Flutter tests
        working-directory: investment_ontology_serverpod_flutter
        run: flutter test
