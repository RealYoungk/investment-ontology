name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VERSION: '4.0.0'
      SERVERPOD_PASSWORD_database: 'L3KJIsnYmp9SZlA1zXcE4VCHu4XH8lBR'
      SERVERPOD_PASSWORD_redis: 'HwEU4oizAZsUicVzFDqr1d46ApJUMb4Q'

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'

      - name: Start containers
        working-directory: investment_ontology_serverpod_server
        run: docker compose up --quiet-pull --build -d

      - name: Install dependencies
        run: flutter pub get

      - name: Install Serverpod CLI
        # `dart install`은 PATH에 없는 폴더에 설치하므로 설치 경로를 PATH에 추가한다.
        run: |
          dart install serverpod_cli $VERSION | tee install.log
          dirname "$(sed -n 's/^Installed: //p' install.log)" >> "$GITHUB_PATH"

      - name: Run Serverpod generator
        working-directory: investment_ontology_serverpod_server
        run: serverpod generate

      - name: Run tests
        working-directory: investment_ontology_serverpod_server
        run: dart test

      - name: Stop containers
        if: always()
        working-directory: investment_ontology_serverpod_server
        run: docker compose down -v
