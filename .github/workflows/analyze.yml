name: Analyze

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # 로컬과 같이 항상 최신 stable을 쓴다.
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        working-directory: investment_ontology_serverpod_server
        run: dart analyze --fatal-infos
