# 배포 B: 작은 서버 한 대에 서버 · DB · 프록시.
#
#   cd deploy && cp .env.example .env   # 값을 채운 뒤
#   docker compose up -d --build
#
# 비밀값은 .env에만 두고 저장소에 넣지 않는다. 자세한 절차는 README.md.
services:
  postgres:
    image: ghcr.io/serverpod/postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: investment_ontology_serverpod
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?set in .env}

  server:
    build:
      context: ..
      dockerfile: investment_ontology_serverpod_server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      runmode: production
      # Serverpod는 config/production.yaml을 읽고, 비밀값만 환경변수로 받는다.
      SERVERPOD_PASSWORD_database: ${POSTGRES_PASSWORD:?set in .env}
      SERVERPOD_PASSWORD_redis: ${REDIS_PASSWORD:?set in .env}
      SERVERPOD_PASSWORD_serviceSecret: ${SERVICE_SECRET:?set in .env}
      SERVERPOD_PASSWORD_dartApiKey: ${DART_API_KEY:?set in .env}
      SERVERPOD_PASSWORD_dataGoKrServiceKey: ${DATA_GO_KR_SERVICE_KEY:?set in .env}
      # AI 관계 추출을 쓸 때만 필요 (없으면 그 기능만 꺼진 채로 돈다).
      SERVERPOD_PASSWORD_anthropicApiKey: ${ANTHROPIC_API_KEY:-}
    expose:
      - "8080"
      - "8082"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set in .env}
      # htpasswd 해시: docker run --rm caddy:2 caddy hash-password --plaintext '비밀번호'
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?set in .env}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?set in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db:
  caddy_data:
  caddy_config:
