<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>광고 로더 샌드박스</title><style>body{font:16px/1.6 system-ui;margin:24px;max-width:900px}button{padding:10px;margin:4px}#slot{width:100%;height:100px;border:1px solid #bbb}#result{white-space:pre-wrap}.adsbygoogle{background:#e8f1f5}</style>
<h1>광고 로더 샌드박스</h1><p>실제 광고 로더를 사용합니다. Google 스크립트 응답은 이 페이지에서 모의 처리하며 외부 광고 요청은 없습니다.</p>
<button id="filled">채워진 광고</button><button id="unfilled">광고 없음</button><button id="error">광고 차단/실패</button><button id="paid">유료 전환/화면 이탈</button><button id="reset">초기화</button>
<div id="slot"></div><output id="result" aria-live="polite">준비됨</output>
<script>
const originalAppend=document.head.appendChild.bind(document.head);
let mode='filled', loads=0, pushes=0;
document.head.appendChild=function(el){
 if(el.tagName==='SCRIPT' && el.src.startsWith('https://pagead2.googlesyndication.com/')){
  loads++; queueMicrotask(()=>mode==='error'?el.onerror():el.onload()); return el;
 } return originalAppend(el);
};
window.adsbygoogle={push(){pushes++;const ad=document.querySelector('#slot ins');if(ad)queueMicrotask(()=>ad.setAttribute('data-ad-status',mode==='unfilled'?'unfilled':'filled'));}};
</script>
<script src="../../investment_ontology_serverpod_flutter/web/ad_loader.js"></script>
<script>
const slot=document.getElementById('slot'), result=document.getElementById('result');
async function run(next){mode=next;alfinderAds.dispose(slot);result.textContent='처리 중';const shown=await alfinderAds.mount(slot,'ca-pub-1234567890123456','1234567890',true);if(!shown)slot.replaceChildren();result.textContent=JSON.stringify({scenario:next,shown,scriptLoads:loads,adRequests:pushes,testMode:slot.querySelector('ins')?.getAttribute('data-adtest')??null},null,2);}
for(const id of ['filled','unfilled','error'])document.getElementById(id).onclick=()=>run(id);
document.getElementById('paid').onclick=()=>{alfinderAds.dispose(slot);result.textContent='광고 제거 완료: DOM '+slot.children.length+'개';};
document.getElementById('reset').onclick=()=>location.reload();
</script></html>
