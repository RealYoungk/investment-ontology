### 인물. 출생년월이 있는 임원, 또는 지분으로 이어진 기업 묶음에서 같은 이름으로 나오는 주주(추정)에게서 만든다.
class: Person
table: person
fields:
  ### 공백을 뗀 이름
  name: String
  birthYear: int?
  birthMonth: int?
  sex: String?
  ### 같은 사람을 찾는 키. 임원 "exec:이름:YYYY-MM", 추정 "cluster:이름:묶음의 첫 corpCode"
  personKey: String
  ### 출생년월 없이 이름과 기업 묶음으로만 정한 인물 (추정)
  estimated: bool
indexes:
  person_key_idx:
    fields: personKey
    unique: true
  person_name_idx:
    fields: name
