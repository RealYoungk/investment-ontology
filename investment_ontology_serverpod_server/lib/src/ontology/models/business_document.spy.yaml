### 사업보고서 본문 "II. 사업의 내용" (공시 원본 파일 document.xml에서 뽑은 글). 4단계 AI 관계 추출의 원천.
class: BusinessDocument
table: business_document
fields:
  reportId: int, relation(parent=disclosure_report, onDelete=Cascade)
  companyId: int
  bsnsYear: int
  rceptNo: String
  ### 원문 제목 (예: II. 사업의 내용)
  title: String
  ### 표는 칸을 ' | '로 이은 줄로, 하위 절 제목은 '## '로 시작하는 줄로 바꾼 글
  text: String
  charCount: int
indexes:
  business_document_report_idx:
    fields: reportId
    unique: true
  business_document_company_idx:
    fields: companyId, bsnsYear
