### 스크리닝 결과 한 줄. 지표는 저장하지 않고 조회할 때 계산하며, 계산에 쓴 값도 함께 준다.
###
### 손익·현금흐름은 최근 12개월(TTM), 재무상태표는 최근 보고서 기말 값이다.
class: ScreenRow
fields:
  company: CompanyRef
  ### 지표를 계산한 사업연도 (가장 최근 연결 보고서)
  bsnsYear: int
  marketCap: BigInt
  revenue: BigInt?
  operatingIncome: BigInt?
  netIncome: BigInt?
  equity: BigInt?
  ### 부채총계 (최근 기말)
  liabilities: BigInt?
  ### 자본총계 (최근 기말). 지배주주 자본인 equity와 다르다
  totalEquity: BigInt?
  ### 잉여현금흐름 = 영업활동 현금흐름 − 유형자산의 취득 (최근 12개월)
  freeCashFlow: BigInt?
  ### 최근 사업연도 현금배당금총액 (원)
  dividendTotal: BigInt?
  per: double?
  pbr: double?
  roe: double?
  operatingMargin: double?
  ### 부채총계 ÷ 자본총계 (%)
  debtRatio: double?
  ### 잉여현금흐름 ÷ 시가총액 (%)
  fcfYield: double?
  ### 현금배당금총액 ÷ 시가총액 (%)
  dividendYield: double?
  ### 매출액 증감률 (올해 누적 vs 전년 같은 기간, %)
  revenueGrowth: double?
  ### 영업이익 증감률 (올해 누적 vs 전년 같은 기간, %)
  operatingIncomeGrowth: double?
  ### 대표 종목 종가 (최근 거래일, 원). 기업에 종목이 여럿이면 시가총액이 가장 큰 것
  closePrice: int?
  ### 3개월 주가 등락률 (%)
  return3m: double?
  ### 12개월 주가 등락률 (%)
  return12m: double?
  ### 최근 1년 종가의 최고·최저 (원)
  high52w: int?
  low52w: int?
  ### 52주 밴드에서 지금 종가의 자리 (0 = 최저, 100 = 최고)
  bandPosition: double?
  ### 최근 한 달 하루 평균 거래대금 (원). 얼마나 사고팔 수 있는지
  avgTradingValue: BigInt?
  ### 최근 연간 배당 공시 기준연도
  dividendYear: int?
  ### 최근 연간 공시 현금배당성향 (%), 연결 우선. 음수는 계산 불가
  dividendPayout: double?
  ### 같은 연간 공시의 당기·전기·전전기에서 확인된 연속 현금배당 (0~3년). 누락은 연속으로 간주하지 않음
  dividendYears: int?
  ### 대표 종목 기준일 거래량 (주)
  volume: BigInt?
  ### 기준일 거래량 ÷ 직전 20거래일 평균 거래량. 20일 미달·0분모·주식수 큰 변동은 null
  volumeRatio: double?
  ### 실제 계산에 사용한 재무 기준과 최신 보고서
  fsDiv: FsDiv?
  reportCode: FinancialReportCode?
  basisReason: String?
  ### 계산하지 못한 지표별 사유 (저장하지 않음)
  metricNotes: Map<String, String>?
