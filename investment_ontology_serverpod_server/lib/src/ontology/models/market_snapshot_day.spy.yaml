### 수집 장부: 시세를 받은 기준일. 휴장일(0건)도 기록해 다시 조회하지 않는다.
class: MarketSnapshotDay
table: market_snapshot_day
fields:
  ### 기준일 (UTC 자정)
  baseDate: DateTime
  rowCount: int
  sourceId: int?, relation(parent=source, onDelete=SetNull)
  fetchedAt: DateTime
indexes:
  market_snapshot_day_date_idx:
    fields: baseDate
    unique: true
